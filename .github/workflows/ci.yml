name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ruleset requires the check named exactly `test`: one job, no matrix,
  # no `name:` override (a matrix would report as `test (22)`).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: |
          npm install --global npm@12.2.2 --ignore-scripts
          npm ci
          npm ci --prefix scripts/browser-check --ignore-scripts

      - name: Conventional commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          npx commitlint --from "$BASE" --to "$HEAD" --verbose
          printf '%s\n' "$TITLE" | npx commitlint --verbose

      - name: Release order
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-release.py "$BASE" "$HEAD"

      - name: Release race and rollback tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck && npm run typecheck:browser

      - name: Unit tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Inventory and package install
        run: npm run inventory:check && npm run test:package

      - name: Node 24 compatibility
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Verify Node 24
        run: |
          npm install --global npm@12.2.2 --ignore-scripts
          npm run typecheck
          npm test
          npm run test:package

      - name: Docker build
        run: docker build -t altegio-me-mcp:ci .

      - name: Container smoke test
        run: |
          bash scripts/smoke.sh altegio-me-mcp:ci
          bash scripts/image-gate.sh altegio-me-mcp:ci

      # Last, so the other signals still print when a new advisory appears.
      - name: Dependency audit
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=moderate
          npm audit --prefix scripts/browser-check --audit-level=low
