# Deploy pipeline for the Cloud Run service altegio-me-mcp (OPS-02).
#
# Production changes reach Cloud Run only through the Cloud Build trigger on a
# merge to main. Nobody runs `gcloud run deploy` by hand. Rollback is a revert
# PR through the same trigger; an emergency traffic move by hand needs the
# owner's approval (runbook in plan 03-11).
#
# Flow: build, push the commit tag, deploy a revision that takes no traffic,
# smoke-test that revision on its tag URL, then move traffic to it and drop the
# tag. scripts/release.py serializes rollout using Cloud Run etag and a service
# annotation; release.json orders commits independently of build completion.
#
# Built-ins used: $PROJECT_ID, $SHORT_SHA and $COMMIT_SHA are trigger values.
# A manual `gcloud builds submit` must pass them itself. Inside a bash script
# a literal shell variable is written $$VAR so Cloud Build leaves it alone.
# A built-in inside a substitution VALUE is not expanded (the first trigger
# build, 2026-10-05, tagged the image with a literal $PROJECT_ID), so _IMAGE
# writes the project out; the project is fixed by the bootstrap anyway.
#
# No secret value is here. The two secrets reach the revision as mounted files
# (--set-secrets); the server re-reads them (plans 03-05 and 03-08).
substitutions:
  _REGION: europe-west1
  _SERVICE: altegio-me-mcp
  _IMAGE: europe-west1-docker.pkg.dev/altegio-mcp/cloud-run/altegio-me-mcp
  _RUNTIME_SA: altegio-me-mcp-runtime
  _TOKEN_SECRET: MARKETPLACE_PARTNER_TOKEN
  _PROXY_KEY_SECRET: MCP_PROXY_BACKEND_KEY_ME
  _PUBLIC_BASE_URL: https://mcp.alteg.io/me

steps:
  - id: build
    name: gcr.io/cloud-builders/docker@sha256:fbc05705e6f24467e40ae8a4097ab9b8fae1116551f838fa2c55f4367427fc36
    args:
      [
        build,
        --build-arg,
        'COMMIT_SHA=$COMMIT_SHA',
        -t,
        '${_IMAGE}:$SHORT_SHA',
        .,
      ]

  - id: signed-https-gate
    name: gcr.io/cloud-builders/docker@sha256:fbc05705e6f24467e40ae8a4097ab9b8fae1116551f838fa2c55f4367427fc36
    entrypoint: bash
    args: [scripts/image-gate.sh, '${_IMAGE}:$SHORT_SHA']

  # Only the commit tag is pushed: the repository is shared with the platform's
  # images, so a moving tag such as :latest could overwrite someone else's.
  - id: push
    name: gcr.io/cloud-builders/docker@sha256:fbc05705e6f24467e40ae8a4097ab9b8fae1116551f838fa2c55f4367427fc36
    args: [push, '${_IMAGE}:$SHORT_SHA']

  # The service itself is created once by the bootstrap (plan 03-11), which
  # also turns the invoker check off; later deploys keep both. --set-env-vars
  # and --set-secrets replace the whole set, so this file is the one place that
  # declares them.
  - id: deploy-tagged
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:592.0.0@sha256:3eb25fdc289a5b341bd428a1196690e93e652db436eb044f6bf7d6a19160c238
    entrypoint: /usr/lib/google-cloud-sdk/platform/bundledpythonunix/bin/python3
    args:
      - scripts/release.py
      - $PROJECT_ID
      - ${_REGION}
      - ${_SERVICE}
      - $BUILD_ID
      - $COMMIT_SHA
      - gcloud
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --no-traffic
      - --service-account=${_RUNTIME_SA}@$PROJECT_ID.iam.gserviceaccount.com
      - --ingress=all
      - --min-instances=0
      - --min=1
      - --max=1
      - --max-instances=1
      - --cpu=1
      - --memory=512Mi
      - --concurrency=80
      - --timeout=60
      - --cpu-boost
      - --cpu-throttling
      - --labels=app=altegio-me-mcp
      - --set-env-vars=NODE_ENV=production,PUBLIC_BASE_URL=${_PUBLIC_BASE_URL},LOG_LEVEL=info,COMMIT_SHA=$COMMIT_SHA,ALTEGIO_API_TOKEN_FILE=/secrets/altegio-api/token,MCP_PROXY_BACKEND_KEY_FILE=/secrets/proxy-key/key,CALLER_AUTH=required,EXTRA_ALLOWED_HOSTS=altegio-me-mcp-767969350727.europe-west1.run.app altegio-me-mcp-brg2k7l5ma-ew.a.run.app
      # MARKETPLACE_APPLICATION_ID=2642 joins this list once Altegio has switched application 2642 on for the Altegio.me locations (ADR 0006, D3 amended 2026-10-27); until then the assistant-booking gate stays off.
      - --set-secrets=/secrets/altegio-api/token=${_TOKEN_SECRET}:latest,/secrets/proxy-key/key=${_PROXY_KEY_SECRET}:latest

options:
  # Required when the trigger runs as a user-specified service account.
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
