name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ruleset requires the check named exactly `test`: one job, no matrix,
  # no `name:` override (a matrix would report as `test (22)`).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Conventional commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          npx commitlint --from "$BASE" --to "$HEAD" --verbose
          printf '%s\n' "$TITLE" | npx commitlint --verbose

      - name: Release order
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-release.py "$BASE" "$HEAD"

      - name: Release race and rollback tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build -t altegio-me-mcp:ci .

      - name: Container smoke test
        run: bash scripts/smoke.sh altegio-me-mcp:ci

      # Last, so the other signals still print when a new advisory appears.
      - name: Dependency audit
        run: npm audit --audit-level=high
